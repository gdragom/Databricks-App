<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Databricks Apps — Security Checklist</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}.header{background:linear-gradient(135deg,#1a1f2e 0%,#16213e 50%,#0f3460 100%);padding:24px 32px;border-bottom:1px solid #2d3748;display:flex;align-items:center;gap:16px}.header-icon{font-size:36px}.header h1{font-size:22px;font-weight:700;color:#fff}.header p{font-size:13px;color:#94a3b8;margin-top:2px}.controls-bar{display:flex;gap:12px;padding:16px 32px;background:#1a1f2e;border-bottom:1px solid #2d3748;flex-wrap:wrap;align-items:center}.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid #2d3748;background:transparent;color:#94a3b8;cursor:pointer;font-size:12px;transition:all .2s}.filter-btn:hover,.filter-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}.search-box{padding:6px 12px;border-radius:8px;border:1px solid #2d3748;background:#0f1117;color:#e2e8f0;font-size:13px;width:200px;margin-left:auto}.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:20px 32px;background:#1a1f2e}.stat-card{background:#0f1117;border:1px solid #2d3748;border-radius:12px;padding:16px;text-align:center}.stat-number{font-size:32px;font-weight:800;margin-bottom:4px}.stat-label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}.stat-done .stat-number{color:#22c55e}.stat-progress .stat-number{color:#f59e0b}.stat-notdone .stat-number{color:#ef4444}.stat-na .stat-number{color:#64748b}.stat-pct .stat-number{color:#3b82f6}.progress-bar-wrap{grid-column:1/-1;background:#0f1117;border:1px solid #2d3748;border-radius:12px;padding:16px}.progress-bar-label{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px}.progress-bar-bg{background:#1e293b;border-radius:4px;height:8px}.progress-bar-fill{height:8px;border-radius:4px;background:linear-gradient(90deg,#3b82f6,#22c55e);transition:width .5s ease}.main{padding:20px 32px}.domain-section{margin-bottom:24px}.domain-header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#1a1f2e;border-radius:10px 10px 0 0;border:1px solid #2d3748;border-bottom:none;cursor:pointer}.domain-icon{font-size:20px}.domain-title{font-size:15px;font-weight:600;flex:1}.domain-badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#0f1117;border:1px solid #2d3748;color:#94a3b8}.domain-progress-mini{font-size:12px;color:#22c55e;font-weight:600}.domain-chevron{color:#64748b;transition:transform .3s}.domain-chevron.open{transform:rotate(180deg)}.controls-list{border:1px solid #2d3748;border-top:none;border-radius:0 0 10px 10px;overflow:hidden}.control-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;padding:12px 16px;border-bottom:1px solid #1e293b;align-items:start;transition:background .15s;cursor:pointer}.control-row:hover{background:#1a1f2e}.control-row:last-child{border-bottom:none}.control-row.critical-row{border-left:3px solid #ef4444}.control-id{font-size:11px;color:#64748b;font-family:monospace;font-weight:600;min-width:36px;margin-top:2px}.control-text{font-size:13px;color:#cbd5e1;line-height:1.5}.control-priority{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap;height:fit-content}.priority-critical{background:#450a0a;color:#fca5a5;border:1px solid #7f1d1d}.priority-high{background:#431407;color:#fdba74;border:1px solid #9a3412}.priority-medium{background:#1c1917;color:#a8a29e;border:1px solid #44403c}.status-btn{padding:4px 10px;border-radius:8px;border:1px solid;font-size:11px;cursor:pointer;white-space:nowrap;transition:all .2s;background:transparent}.status-done{color:#22c55e;border-color:#16a34a;background:#052e16}.status-progress{color:#f59e0b;border-color:#d97706;background:#1c1001}.status-notdone{color:#ef4444;border-color:#dc2626;background:#1f0a0a}.status-na{color:#64748b;border-color:#475569;background:#0f172a}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal{background:#1a1f2e;border:1px solid #2d3748;border-radius:16px;padding:24px;width:90%;max-width:520px}.modal h3{font-size:16px;margin-bottom:16px;color:#fff}.modal-field{margin-bottom:14px}.modal-field label{display:block;font-size:12px;color:#94a3b8;margin-bottom:6px}.modal-field select,.modal-field input,.modal-field textarea{width:100%;padding:8px 12px;border-radius:8px;border:1px solid #2d3748;background:#0f1117;color:#e2e8f0;font-size:13px}.modal-field textarea{height:80px;resize:vertical}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500}.btn-primary{background:#3b82f6;color:#fff}.btn-secondary{background:#1e293b;color:#94a3b8}.export-btn{padding:8px 16px;border-radius:8px;border:1px solid #3b82f6;background:transparent;color:#3b82f6;cursor:pointer;font-size:13px;margin-left:8px}.advisory-box{background:#1e1a0a;border:1px solid #92400e;border-radius:10px;padding:16px;margin-bottom:20px}.advisory-box h3{color:#f59e0b;font-size:14px;margin-bottom:8px}.advisory-box ul{padding-left:16px;color:#fcd34d;font-size:12px;line-height:2}</style></head><body><div class='header'><div class='header-icon'>&#x1F512;</div><div><h1>Databricks Apps &mdash; Cyber Security Advisory Checklist</h1><p>Security Architect Advisory &bull; Click any control to update status &bull; Auto-saves to browser</p></div></div><div class='controls-bar'><button class='filter-btn active' onclick='filterDomain(\"all\")'>All Domains</button><button class='filter-btn' onclick='filterStatus(\"not\")'>&#x274C; Not Done</button><button class='filter-btn' onclick='filterStatus(\"progress\")'>&#x1F504; In Progress</button><button class='filter-btn' onclick='filterStatus(\"done\")'>&#x2705; Done</button><button class='filter-btn' onclick='filterPriority(\"critical\")'>&#x1F534; Critical Only</button><input class='search-box' type='text' placeholder='&#x1F50D; Search controls...' oninput='searchControls(this.value)'><button class='export-btn' onclick='exportReport()'>&#x1F4E4; Export JSON</button></div><div class='dashboard' id='dashboard'></div><div class='main' id='main'></div><div class='modal-overlay' id='modal'><div class='modal'><h3 id='modal-title'>Update Control</h3><div class='modal-field'><label>Status</label><select id='modal-status'><option value='not'>&#x274C; Not Done</option><option value='progress'>&#x1F504; In Progress</option><option value='done'>&#x2705; Done</option><option value='na'>&#x23ED;&#xFE0F; N/A</option></select></div><div class='modal-field'><label>Owner</label><input type='text' id='modal-owner' placeholder='Name or team...'></div><div class='modal-field'><label>Target Date</label><input type='date' id='modal-date'></div><div class='modal-field'><label>Notes / Evidence</label><textarea id='modal-notes' placeholder='Ticket link, screenshot ref, implementation notes...'></textarea></div><div class='modal-actions'><button class='btn btn-secondary' onclick='closeModal()'>Cancel</button><button class='btn btn-primary' onclick='saveModal()'>Save</button></div></div></div><script>const domains=[{id:1,icon:'&#x1FAA3;',title:'Identity & Access Management',controls:[{id:'1.1',text:'Enforce SSO via existing IdP (Entra ID / Okta) for all App access',priority:'critical'},{id:'1.2',text:'Confirm Databricks-managed passwords are disabled (EOL July 2024)',priority:'critical'},{id:'1.3',text:'Enforce MFA for all App users',priority:'critical'},{id:'1.4',text:'Assign a dedicated Service Principal per App — no sharing',priority:'high'},{id:'1.5',text:'Apply least privilege — use CAN USE not CAN MANAGE by default',priority:'high'},{id:'1.6',text:'Configure OAuth 2.0 user authorization (on-behalf-of) for user-context data access',priority:'high'},{id:'1.7',text:'Use SCIM provisioning for automated joiners/leavers lifecycle',priority:'high'},{id:'1.8',text:'Enable Unified Login for centralized identity control',priority:'medium'},{id:'1.9',text:'Restrict CAN MANAGE to App owners / platform admins only',priority:'high'},{id:'1.10',text:'Enforce PAT max lifetime (730 days); auto-revoke after 90 days inactive',priority:'high'}]},{id:2,icon:'&#x1F6E1;',title:'Authorization & Data Access',controls:[{id:'2.1',text:'Align App Service Principal with existing Unity Catalog RBAC policies',priority:'critical'},{id:'2.2',text:'Enforce Row-Level Security & column masking for App queries via Unity Catalog',priority:'critical'},{id:'2.3',text:'Minimize OAuth scopes — request only what the App genuinely needs',priority:'high'},{id:'2.4',text:'Validate App does not bypass existing workspace ACLs',priority:'critical'},{id:'2.5',text:'Separate App Service Principal permissions from interactive user permissions',priority:'high'},{id:'2.6',text:'External collaborators must use JIT provisioning via identity federation',priority:'high'},{id:'2.7',text:'Do not grant EXTERNAL USE SCHEMA unless explicitly justified',priority:'high'},{id:'2.8',text:'Validate permission scopes during mandatory code review before deployment',priority:'high'}]},{id:3,icon:'&#x1F511;',title:'Secrets & Credential Management',controls:[{id:'3.1',text:'Never expose raw secrets in environment variables — use valueFrom in app config',priority:'critical'},{id:'3.2',text:'Store all secrets in Databricks Secret Scopes or Azure Key Vault / AWS Secrets Manager',priority:'critical'},{id:'3.3',text:'Rotate secrets regularly, especially upon offboarding or role changes',priority:'high'},{id:'3.4',text:'Enable credential redaction in logs',priority:'high'},{id:'3.5',text:'Restrict secret scope access to only the App Service Principal',priority:'high'}]},{id:4,icon:'&#x1F310;',title:'Network Security',controls:[{id:'4.1',text:'Restrict outbound network — whitelist only required domains (package repos, APIs)',priority:'high'},{id:'4.2',text:'Use dry-run mode & denial logs to validate network policy config',priority:'high'},{id:'4.3',text:'Account for the Databricks reverse proxy — do not trust origin IP for authentication',priority:'medium'},{id:'4.4',text:'Confirm TLS is terminated by Databricks; App supports HTTP/2 cleartext (H2C) internally',priority:'medium'},{id:'4.5',text:'Align App network policies with existing workspace VPC / Private Link setup',priority:'high'},{id:'4.6',text:'Disable public internet access to the App unless explicitly required and approved',priority:'high'}]},{id:5,icon:'&#x1F4BB;',title:'Secure Coding & Development',controls:[{id:'5.1',text:'Enforce peer code review for all App code before production deployment',priority:'high'},{id:'5.2',text:'Offload heavy compute to Databricks SQL / Lakeflow Jobs — not App runtime',priority:'medium'},{id:'5.3',text:'Implement graceful shutdown (SIGTERM within 15 seconds)',priority:'medium'},{id:'5.4',text:'Validate and sanitise all user inputs to prevent injection attacks',priority:'critical'},{id:'5.5',text:'App must not store sensitive data in client-side state or browser storage',priority:'high'},{id:'5.6',text:'Run SAST and dependency vulnerability scans before every deployment',priority:'high'}]},{id:6,icon:'&#x1F4CB;',title:'Audit Logging & Monitoring',controls:[{id:'6.1',text:'Enable Databricks System Tables for full App activity audit trail',priority:'critical'},{id:'6.2',text:'App must emit structured logs: user identity, action, target resource, status',priority:'high'},{id:'6.3',text:'Forward audit logs to SIEM (Splunk / Sentinel) for centralized monitoring',priority:'high'},{id:'6.4',text:'Configure alerts for anomalous App access patterns',priority:'high'},{id:'6.5',text:'Define an incident response plan for App-related security events',priority:'high'},{id:'6.6',text:'Monitor App Service Principal activity separately from user activity',priority:'medium'}]},{id:7,icon:'&#x1F5C4;',title:'Data Protection',controls:[{id:'7.1',text:'Confirm App only accesses data via Unity Catalog — no direct storage bypass',priority:'critical'},{id:'7.2',text:'Apply data masking / anonymisation for PII surfaced through the App',priority:'critical'},{id:'7.3',text:'Confirm encryption at rest (Customer-Managed Keys) inherited from workspace config',priority:'high'},{id:'7.4',text:'Confirm TLS encryption in transit for all App communications',priority:'high'},{id:'7.5',text:'Classify data the App exposes and apply appropriate sensitivity labels',priority:'high'}]},{id:8,icon:'&#x1F4CA;',title:'Governance & Compliance',controls:[{id:'8.1',text:'Register App and its Service Principal in org application inventory',priority:'high'},{id:'8.2',text:'Conduct DPIA if App processes personal data',priority:'high'},{id:'8.3',text:'Validate App meets applicable standards (HIPAA / PCI-DSS / GDPR / internal policy)',priority:'high'},{id:'8.4',text:'Include App in quarterly access reviews',priority:'high'},{id:'8.5',text:'Document App architecture, data flows, and security controls',priority:'medium'},{id:'8.6',text:'Run Databricks Security Analysis Tool (SAT) post-deployment',priority:'medium'}]}];let state={};let activeFilter='all';let activeSearch='';let currentModal=null;function loadState(){try{const s=localStorage.getItem('db_app_sec');if(s)state=JSON.parse(s);}catch(e){}}function saveState(){localStorage.setItem('db_app_sec',JSON.stringify(state));}function getControl(id){return state[id]||{status:'not',owner:'',date:'',notes:''};}function statusLabel(s){const m={not:'&#x274C; Not Done',progress:'&#x1F504; In Progress',done:'&#x2705; Done',na:'&#x23ED;&#xFE0F; N/A'};return m[s]||m.not;}function statusClass(s){const m={not:'status-notdone',progress:'status-progress',done:'status-done',na:'status-na'};return m[s]||m.not;}function priorityLabel(p){const m={critical:'&#x1F534; Critical',high:'&#x1F7E0; High',medium:'&#x1F7E1; Medium'};return m[p];}function priorityClass(p){const m={critical:'priority-critical',high:'priority-high',medium:'priority-medium'};return m[p];}function getCounts(){let done=0,prog=0,notd=0,na=0,total=0;domains.forEach(d=>d.controls.forEach(c=>{total++;const s=getControl(c.id).status;if(s==='done')done++;else if(s==='progress')prog++;else if(s==='na')na++;else notd++;}));return{done,prog,notd,na,total};}function renderDashboard(){const c=getCounts();const pct=Math.round(c.done/c.total*100);document.getElementById('dashboard').innerHTML=`<div class='stat-card stat-done'><div class='stat-number'>${c.done}</div><div class='stat-label'>&#x2705; Done</div></div><div class='stat-card stat-progress'><div class='stat-number'>${c.prog}</div><div class='stat-label'>&#x1F504; In Progress</div></div><div class='stat-card stat-notdone'><div class='stat-number'>${c.notd}</div><div class='stat-label'>&#x274C; Not Done</div></div><div class='stat-card stat-na'><div class='stat-number'>${c.na}</div><div class='stat-label'>&#x23ED;&#xFE0F; N/A</div></div><div class='stat-card stat-pct'><div class='stat-number'>${pct}%</div><div class='stat-label'>Complete</div></div><div class='progress-bar-wrap'><div class='progress-bar-label'><span>Overall Completion</span><span>${c.done}/${c.total} controls</span></div><div class='progress-bar-bg'><div class='progress-bar-fill' style='width:${pct}%'></div></div></div>`;}function isVisible(ctrl){const s=getControl(ctrl.id).status;if(activeSearch){const q=activeSearch.toLowerCase();if(!ctrl.text.toLowerCase().includes(q)&&!ctrl.id.toLowerCase().includes(q))return false;}if(activeFilter==='all')return true;if(activeFilter==='critical')return ctrl.priority==='critical';if(activeFilter==='done')return s==='done';if(activeFilter==='progress')return s==='progress';if(activeFilter==='not')return s==='not';return true;}function renderMain(){const el=document.getElementById('main');el.innerHTML='';domains.forEach(d=>{const visibleControls=d.controls.filter(c=>isVisible(c));if(visibleControls.length===0)return;const total=d.controls.length;const done=d.controls.filter(c=>getControl(c.id).status==='done').length;const pct=Math.round(done/total*100);const sec=document.createElement('div');sec.className='domain-section';sec.innerHTML=`<div class='domain-header' onclick='toggleDomain(${d.id})'><div class='domain-icon'>${d.icon}</div><div class='domain-title'>Domain ${d.id}: ${d.title}</div><div class='domain-badge'>${visibleControls.length} controls</div><div class='domain-progress-mini'>${done}/${total} done (${pct}%)</div><div class='domain-chevron open' id='chev-${d.id}'>&#x25BC;</div></div><div class='controls-list' id='dom-${d.id}'>${visibleControls.map(c=>{const ctrl=getControl(c.id);return`<div class='control-row ${c.priority==='critical'?'critical-row':''}' onclick='openModal(\"${c.id}\")'><div class='control-id'>${c.id}</div><div><div class='control-text'>${c.text}</div>${ctrl.owner?`<div style='font-size:11px;color:#64748b;margin-top:3px'>&#x1F464; ${ctrl.owner}${ctrl.date?' &bull; &#x1F4C5; '+ctrl.date:''}</div>`:''}</div><div class='control-priority ${priorityClass(c.priority)}'>${priorityLabel(c.priority)}</div><div class='status-btn ${statusClass(ctrl.status)}'>${statusLabel(ctrl.status)}</div></div>`;}).join('')}</div>`;el.appendChild(sec);});}function toggleDomain(id){const el=document.getElementById('dom-'+id);const chev=document.getElementById('chev-'+id);if(el.style.display==='none'){el.style.display='';chev.classList.add('open');}else{el.style.display='none';chev.classList.remove('open');}}function openModal(id){currentModal=id;const ctrl=getControl(id);document.getElementById('modal-title').textContent='Control '+id;document.getElementById('modal-status').value=ctrl.status;document.getElementById('modal-owner').value=ctrl.owner||'';document.getElementById('modal-date').value=ctrl.date||'';document.getElementById('modal-notes').value=ctrl.notes||'';document.getElementById('modal').classList.add('show');}function closeModal(){document.getElementById('modal').classList.remove('show');currentModal=null;}function saveModal(){if(!currentModal)return;state[currentModal]={status:document.getElementById('modal-status').value,owner:document.getElementById('modal-owner').value,date:document.getElementById('modal-date').value,notes:document.getElementById('modal-notes').value};saveState();closeModal();render();}function filterDomain(d){activeFilter=d;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');render();}function filterStatus(s){activeFilter=s;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');render();}function filterPriority(p){activeFilter=p;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');render();}function searchControls(q){activeSearch=q;render();}function exportReport(){const report={generated:new Date().toISOString(),summary:getCounts(),controls:{}};domains.forEach(d=>d.controls.forEach(c=>{report.controls[c.id]={domain:d.title,control:c.text,priority:c.priority,...getControl(c.id)};}));const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='databricks_security_report.json';a.click();}function render(){renderDashboard();renderMain();}document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});loadState();render();</script></body></html>
